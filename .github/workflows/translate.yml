name: Publish Release

on:
  push:
    paths:
      - "updates/update_ru.json"
      - "translate.py"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Translate
        id: translate
        run: python translate.py

      - name: Commit translations
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add updates/

          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Update translations"
            git push
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.translate.outputs.tag }}
          name: ${{ steps.translate.outputs.tag }}
          body: ${{ steps.translate.outputs.body }}
          files: |
            files/${{ steps.translate.outputs.base }}.apk
            files/${{ steps.translate.outputs.base }}_arm64-v8a.apk
            files/${{ steps.translate.outputs.base }}_armeabi-v7a.apk
            files/${{ steps.translate.outputs.base }}_x86.apk
            files/${{ steps.translate.outputs.base }}_x86_64.apk